<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Eckos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/icon-180.png">

<style>
/* Layout: cut-steel app shell, one dark world by choice. Phone = column + bottom bar; desktop = left rail + content. Heat gradient = progress, hex badges = ranks. */
:root{
  color-scheme:dark;
  --bg:#11151c; --surface:#1a2029; --raise:#242c38; --ink:#f1ede4; --muted:#98a1ae; --line:#303a48;
  --hot:#ff6a1a; --hot2:#ffc233; --on-hot:#1b1206; --cool:#6fc3ff;
  --rn:#3a4452; --r0:#7d8794; --r1:#c07a45; --r2:#c9d1da; --r3:#f2c230; --r4:#e2455f; --r5:#2fc98a; --r6:#6fd3ff; --r7:#b68cff;
  --display:"Big Shoulders Display","Arial Narrow","Impact",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cut:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
.app{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:14px 104px;display:grid;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:900 34px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand b,.heat{background:linear-gradient(95deg,var(--hot),var(--hot2));-webkit-background-clip:text;background-clip:text;color:transparent}
#sync{font-size:13px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;padding:14px 2px 12px;background:none;border:0;color:var(--muted);font:800 14px var(--display);letter-spacing:.02em;text-transform:uppercase;cursor:pointer;border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-image:linear-gradient(90deg,var(--hot),var(--hot2)) 1}
main{min-width:0;display:grid;gap:16px;align-content:start}
h1{font:900 42px/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
h3{font:600 16px/1.25 var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.panel{background:var(--surface);clip-path:var(--cut);padding:18px 16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{min-width:0;flex:1}
.tag{display:inline-block;font:800 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--hot2)}
.btn{font:800 19px var(--display);letter-spacing:.07em;text-transform:uppercase;padding:11px 22px;border:0;background:linear-gradient(95deg,var(--hot),var(--hot2));color:var(--on-hot);cursor:pointer;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.btn.ghost{background:var(--raise);color:var(--ink)}
.btn.mini{font-size:15px;padding:7px 16px}
.btn:focus-visible,.pcard:focus-visible{outline:0;box-shadow:inset 0 0 0 3px var(--cool)}
:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
input,select{font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px;min-width:0;max-width:100%}
input[type=checkbox]{flex:none;width:18px;height:18px;padding:0;accent-color:var(--hot)}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted);min-width:0}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.wide{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:800 15px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border:0;background:var(--raise);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge{flex:none;width:44px;aspect-ratio:1/1.12;clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));display:grid;place-items:center;font:900 17px var(--display);color:#10141a}
.badge.sm{width:32px;font-size:13px} .badge.lg{width:92px;font-size:36px}
.badge.gem{clip-path:none;background-color:transparent;background-image:url(img/ranks.png);background-size:400% 200%;background-repeat:no-repeat;display:block;position:relative;filter:drop-shadow(0 3px 7px rgba(0,0,0,.5))}
.badge.gem::after{content:attr(data-div);position:absolute;right:-4px;bottom:-3px;background:#10141a;color:#fff3c4;font:800 .42em var(--display);letter-spacing:.04em;line-height:1;padding:2px 5px;border:1px solid rgba(255,255,255,.22)}
.badge.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.badge.pop{animation:none}}
.bar{height:8px;background:var(--raise);overflow:hidden;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b3261e,var(--hot) 45%,var(--hot2) 85%,#fff3c4)}
.ladder{display:flex;flex-wrap:wrap;gap:10px 14px}
.ladder div{display:grid;justify-items:center;gap:4px;font:800 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{padding:26px 18px;gap:18px;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.022) 22px 24px),var(--surface)}
.hero h1{font-size:clamp(46px,11vw,84px);line-height:.88}
.feats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.feats p{font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.stat b{display:block;font:900 36px/1 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.fig{display:block;width:100%;height:auto;background:var(--raise)}
.anim .wmark{animation:wbob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.anim .mglow{animation:mpulse 1.4s ease-in-out infinite}
@keyframes wbob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.6px)}}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.anim .wmark,.anim .mglow{animation:none}}
.fig .b{stroke:var(--ink);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .q{stroke:var(--hot);stroke-width:4;stroke-linecap:round;fill:none}
.fig .c{stroke:var(--hot2);stroke-width:1.5;fill:none}
.fig .fl{stroke:var(--line);stroke-width:2}
.thumb{flex:none;width:72px}
.picker{display:grid;gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pcard{position:relative;display:grid;gap:4px;align-content:start;text-align:left;padding:0 0 8px;border:0;background:var(--raise);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.pcard .pname{font:600 14px/1.2 var(--body);padding-inline:8px}
.pcard .pmus{font:800 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-inline:8px}
.pcard[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--hot)}
.pcard[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;display:grid;place-items:center;background:var(--hot);color:var(--on-hot);font-weight:700;font-size:14px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr);gap:8px;align-items:center}
.set span{color:var(--muted);font-size:14px;text-align:center}
.set input,.mark input{width:100%}
.mark{display:grid;grid-template-columns:56px minmax(0,1fr) 76px 10px 64px;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.mark:first-of-type{border-top:0}
.hint{font-size:14px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.list>div{padding-block:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.list>div:first-child{border-top:0}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bodymap{max-width:420px;width:100%;height:auto;display:block;margin:auto}
.bodymap text{fill:var(--muted);font:800 9px var(--display);letter-spacing:.1em}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:500 9px var(--body)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:right;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font:800 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
tr.me td{background:var(--raise)}
td button{font:inherit;color:var(--cool);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-align:left}
.duel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos figure{margin:0;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--raise)}
ul.plain{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
#toast,#rest{position:fixed;left:16px;right:16px;margin:auto;max-width:440px;z-index:9;padding:12px 14px;font-size:15px}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg)}
#rest{top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(95deg,var(--hot),var(--hot2));color:var(--on-hot);font:900 24px var(--display);letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
#rest button{font:800 14px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--on-hot);color:var(--hot2);border:0;padding:6px 10px;cursor:pointer}
@media (min-width:820px){
  .app{grid-template-columns:180px minmax(0,1fr);padding-block:24px 40px;column-gap:28px}
  .top,.app.solo main,#sync{grid-column:1/-1}
  nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;flex-direction:column;background:none;border:0;padding:0}
  nav button{text-align:left;padding:10px 12px;border-top:0;border-left:3px solid transparent;font-size:22px}
  nav button[aria-current="page"]{border-image:linear-gradient(180deg,var(--hot),var(--hot2)) 1}
  #toast{bottom:24px}
}
body{background:radial-gradient(900px 420px at 85% -140px,rgba(255,106,26,.16),transparent 70%) no-repeat,var(--bg)}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}
nav button{display:grid;justify-items:center;gap:3px}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"] svg{stroke:var(--hot2)}
.tag::before{content:"// ";color:var(--hot)}
.halo{position:relative;display:grid;place-items:center;flex:none}
.halo::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 9px,color-mix(in srgb,var(--c) 38%,transparent) 9px 10.5px);-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%)}
.halo>*{position:relative}
.ava{flex:none;width:64px;aspect-ratio:1/1.12;clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);background:var(--raise);object-fit:cover;display:grid;place-items:center;font:900 26px var(--display);color:var(--muted)}
.ava-char{object-position:50% 18%;background:linear-gradient(160deg,var(--raise),#10141a)}
.ava.sm{width:30px;font-size:14px} .ava.lg{width:96px;font-size:42px}
.card{background:linear-gradient(135deg,color-mix(in srgb,var(--hot) 20%,var(--surface)),var(--surface) 60%);border-top:3px solid var(--hot)}
.pips{display:flex;gap:5px}
.pips i{flex:1;height:12px;background:var(--raise);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.pips i.on{background:linear-gradient(95deg,var(--hot),var(--hot2))}
.logros{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.logro{background:var(--raise);padding:12px;display:grid;gap:2px;align-content:start;opacity:.5}
.logro.on{opacity:1;box-shadow:inset 3px 0 0 var(--hot2)}
.logro b{font:800 17px var(--display);letter-spacing:.05em;text-transform:uppercase}
.logro span{font-size:13px;color:var(--muted)}
.basic{grid-template-columns:72px minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.basic .in{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:12px}
.weekstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.wk{background:var(--raise);padding:10px 4px;text-align:center;display:grid;gap:5px;align-content:start;border:0;color:var(--ink);font:inherit;cursor:pointer;min-height:66px}
.wk b{font:800 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wk.has{box-shadow:inset 0 -3px 0 var(--hot2)}
.wk .nm{font-size:11px;line-height:1.25;color:var(--ink)}
.wk .plus{font:900 20px var(--display);color:var(--hot2);line-height:1}
.strip div{display:grid;justify-items:center;gap:4px;text-align:center}
.flag{font-size:.9em}
@media (min-width:820px){nav button{display:flex;align-items:center;gap:10px}}
.pwrap{position:relative;min-width:0;display:grid}
.pinfo{position:absolute;top:6px;left:6px;width:26px;height:26px;border:0;background:rgba(17,21,28,.8);color:var(--ink);font:700 14px var(--body);cursor:pointer}
.blist{display:grid}
.bitem{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.bitem:first-child{border-top:0}
.bitem .thumb{width:64px}
.num{font:900 24px var(--display);color:var(--hot)}
.step{display:grid;gap:3px}
.step button,.bact button{width:32px;height:32px;border:0;background:var(--bg);color:var(--ink);font:700 17px var(--body);cursor:pointer}
.step b{min-width:28px;text-align:center;font:900 22px var(--display)}
.bact{display:grid;gap:4px}
.bact button:disabled{opacity:.25;cursor:default}
[data-info]{cursor:pointer}
.tt{min-width:0}
.daychip{font:800 13px var(--display);letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(95deg,var(--hot),var(--hot2));color:var(--on-hot);padding:3px 9px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.quote{font:800 20px/1.15 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.herofigs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.heroart{display:block;width:min(60%,260px);margin:4px auto 2px;filter:drop-shadow(0 20px 28px rgba(0,0,0,.55))}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,7,10,.72);display:grid;place-items:end center;padding:16px}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto}
.cues{margin:0;padding-left:20px;display:grid;gap:6px}
.cues li::marker{color:var(--hot)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (min-width:820px){#sheet{place-items:center}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="16" r="4.5" fill="var(--hot)"/><path d="M17 8a11 11 0 0 1 0 16M23.5 4a17 17 0 0 1 0 24" fill="none" stroke="var(--hot2)" stroke-width="3" stroke-linecap="round"/></svg><span>Eck<b>os</b></span></div><div id="me"></div></header>
  <nav id="nav" aria-label="Secciones" hidden></nav>
  <main id="view"><p class="muted">Calentando…</p></main>
  <footer id="sync">Conectando…</footer>
</div>
<div id="rest" hidden><span></span><button type="button" id="rest-x">Saltar</button></div>
<div id="toast" role="status" hidden></div>
<div id="sheet" hidden></div>
<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v===false||v==null)continue;if(x==='class')e.className=v;else if(x==='text')e.textContent=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v===true?'':v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c);return e};
const n=v=>Math.round(v).toLocaleString('es');
const n1=v=>(Math.round(v*10)/10).toLocaleString('es');

/* ---------- catálogo ---------- */
const MUS={pecho:'Pecho',espalda:'Espalda',hombros:'Hombros',biceps:'Bíceps',triceps:'Tríceps',cuad:'Cuádriceps',post:'Isquios y glúteos',core:'Core'};
// [id, nombre, músculo, 1RM/peso corporal para el tope de la escala, fracción del peso corporal que se levanta]
const EX=[
['banca','Press de banca','pecho',1.5,0],['incl_manc','Press inclinado con mancuernas','pecho',.55,0],['press_manc','Press plano con mancuernas','pecho',.6,0],['flexiones','Flexiones','pecho',1.4,.64],
['dominadas','Dominadas','espalda',1.6,1],['remo_barra','Remo con barra','espalda',1.3,0],['jalon','Jalón al pecho','espalda',1.2,0],['remo_manc','Remo con mancuerna','espalda',.6,0],['remo_inv','Remo invertido','espalda',1.2,.6],
['militar','Press militar','hombros',.95,0],['hombro_manc','Press de hombros con mancuernas','hombros',.4,0],['laterales','Elevaciones laterales','hombros',.2,0],['pica','Flexiones en pica','hombros',1.3,.7],
['curl_barra','Curl con barra','biceps',.65,0],['curl_manc','Curl con mancuernas','biceps',.28,0],['supinas','Dominadas supinas','biceps',1.6,1],
['fondos','Fondos','triceps',1.7,1],['polea_tri','Extensión de tríceps en polea','triceps',.6,0],['ext_manc','Extensión sobre la cabeza','triceps',.3,0],['diamante','Flexiones diamante','triceps',1.3,.64],
['sentadilla','Sentadilla con barra','cuad',2,0],['prensa','Prensa de piernas','cuad',3.2,0],['goblet','Sentadilla goblet','cuad',.6,0],['bulgara','Sentadilla búlgara','cuad',1.6,.8],['sent_libre','Sentadilla sin peso','cuad',1.8,.8],
['peso_muerto','Peso muerto','post',2.4,0],['rumano','Peso muerto rumano','post',1.9,0],['hip_thrust','Hip thrust','post',2.4,0],['rumano_manc','Peso muerto rumano con mancuernas','post',.7,0],['puente','Puente de glúteo a una pierna','post',1.3,.6],
['crunch_polea','Crunch en polea','core',.9,0],['elev_piernas','Elevación de piernas colgado','core',.8,.4],['crunch','Crunch abdominal','core',.7,.3],
['press_cerrado','Press cerrado','triceps',1.1,0],['press_frances','Press francés','triceps',.35,0],
['aperturas','Aperturas con mancuernas','pecho',.4,0],['press_inclinado_barra','Press inclinado con barra','pecho',1.2,0],
['curl_martillo','Curl martillo','biceps',.3,0],
['remo_polea','Remo sentado en polea','espalda',1.1,0],['remo_t','Remo en T','espalda',1.3,0],['pullover','Pull-over con mancuerna','espalda',.45,0],['face_pull','Face pull','hombros',.35,0],
['elev_frontal','Elevación frontal','hombros',.18,0],
['zancadas','Zancadas','cuad',.9,.7]
].map(([id,name,mus,ref,bwf])=>({id,name,mus,ref,bwf}));
